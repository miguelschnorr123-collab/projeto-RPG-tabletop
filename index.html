/* ===== Tema: instalação de pesquisa (estilo Abiotic Factor) ===== */
:root{--bg:#0e1214;--sf:#172024;--ink:#dde6e1;--mu:#86978f;--rule:#2c3b40;--acc:#f0a22e;--red:#e0553a;--grn:#4cc3a0;--f1:'Chakra Petch','Rajdhani','Segoe UI',system-ui,sans-serif;--f2:'Share Tech Mono',ui-monospace,Consolas,monospace}
body{font-family:var(--f1);background-color:var(--bg);background-image:linear-gradient(rgba(76,195,160,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(76,195,160,.045) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,rgba(240,162,46,.07),transparent 60%);background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
#top{position:sticky;top:0;z-index:8;background:#090d0e}
#top nav{position:static;background:#090d0e;border-bottom:0;align-items:stretch}
#top nav::before{content:"PZ-RPG ▸ TERMINAL DO SOBREVIVENTE";font-family:var(--f2);color:var(--acc);padding:0 1.4rem 0 1.2rem;align-self:center;letter-spacing:.14em;font-size:.78rem;border-right:1px solid var(--rule);margin-right:.5rem;white-space:nowrap}
#top nav button{font-family:var(--f2);text-transform:uppercase;letter-spacing:.12em;font-size:.9rem;padding:.85rem 1.6rem;border-bottom:3px solid transparent}
#top nav button:hover{color:var(--acc)}
#top nav button.on{background:var(--acc);color:#0b0f10;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
#top::after{content:"";display:block;height:7px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#0b0f10 12px 24px)}
h2{font-family:var(--f1);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:1rem;color:var(--acc);border-bottom:1px solid var(--rule);padding-bottom:.3rem}
h2::before{content:"▌";margin-right:.55rem}
.card h3::before,.popc h3::before{content:"// ";color:var(--acc)}
.card,.popc,.res,.pgw .report,.pgw .mm,.pgw .panel{background:var(--sf);border:1px solid var(--rule);border-left:3px solid var(--acc)}
.card,.popc{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
button{border-radius:0;font-family:var(--f2);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;background:#1b282d;border:1px solid var(--rule)}
button:hover{border-color:var(--acc);color:var(--acc)}
button.go,.pgw .btn{background:var(--acc);color:#0b0f10;border-color:var(--acc);font-weight:700}
button.go:hover,.pgw .btn:hover{color:#0b0f10;filter:brightness(1.12)}
.pgw .btn.alt,.pgw .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button.lnk{text-transform:none;letter-spacing:0}
.ft{font-family:var(--f1);text-transform:none;letter-spacing:0}
.ft.on{background:var(--acc);color:#0b0f10;border-color:var(--acc)}.ft.on small{color:#2a2a2a}
.seg{border:1px solid var(--acc)}.seg button{border:0}.seg button.on{background:var(--acc);color:#0b0f10}
.seg button[data-v="panico"].on{background:var(--red);color:#fff}
input[type=number],input[type=text],select,textarea{background:#0b1012;border:1px solid var(--rule);border-radius:0;font-family:var(--f2);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{font-family:var(--f2);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}label.ck{text-transform:none;font-family:var(--f1);letter-spacing:0;font-size:.9rem}
.pb{background:#0b1012;border:1px solid var(--rule);height:.65rem}.pb b{background:var(--acc)}.pb.life b{background:var(--red)}
.tg{font-family:var(--f2);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.hint{font-family:var(--f2);font-size:.8rem}
.log{font-family:var(--f2);font-size:.82rem}
.ctl{background:#090d0e;border-top:2px solid var(--acc)}
.res{border-left-color:var(--acc)}
.rg{fill:var(--grn);stroke:#071012}.rg.sel{stroke:var(--acc);stroke-width:4}.bodymap.zombie .rg{fill:#b9803c}
.bodymap text{fill:#fff;stroke:#000;stroke-width:2.2px;paint-order:stroke;font-family:var(--f2)}
.bodymap text.side{text-anchor:start;font-size:7.5px;stroke:none;fill:var(--mu);font-weight:400}
.bodymap text.side:last-of-type{text-anchor:end}
.toast{background:var(--acc);color:#0b0f10;font-family:var(--f2);text-transform:uppercase;letter-spacing:.05em;border:1px solid #000}
.popbg{backdrop-filter:blur(2px)}
.pgw{--f-display:var(--f1);--f-body:var(--f1)}
.pgw h1.pg,.pgw h2,.pgw .cn,.pgw .panel h3,.pgw .report h3,.pgw .syn h4{font-family:var(--f1);text-transform:uppercase;letter-spacing:.1em}
.pgw h1.pg{color:var(--acc);font-size:1.15rem}
.pgw details.cat{border-top:1px solid var(--acc)}
.pgw .cats{border-bottom:1px solid var(--acc)}
.pgw .st{border:1px solid var(--acc)}.pgw .st button{font-size:1.1rem}
.pgw .up{background:var(--acc);color:#0b0f10;font-family:var(--f2);text-transform:uppercase}
.pgw .last,.pgw .chipb{font-family:var(--f2)}
.pgw .sk.on{background:#1d2b30;box-shadow:inset 4px 0 0 var(--acc)}
@media (min-width:1000px){
 body{font-size:16px}
 main{max-width:1780px;padding:1.4rem 2.2rem 4rem}
 .fgrid{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:1.8rem;align-items:start}
 .fside{position:sticky;top:4.6rem;max-height:calc(100vh - 5.4rem);overflow:auto;padding-right:.3rem}
 .bodymap{width:230px}
 .fside .bodymap{width:250px}
 .cols{gap:1.8rem}
 .pgw .cats{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem;align-items:start;border-bottom:0}
 .pgw .pend,.pgw .report{grid-column:1/-1}
}
@media (max-width:999px){#top nav::before{display:none}.fside{margin-bottom:1rem}}

/* ===== Tabletop ===== */
.mesa-wrap{position:relative;z-index:61;width:fit-content;max-width:100%;overflow:auto;border:1px solid var(--rule);background:#070b0c;max-height:calc(100vh - 15rem);min-height:300px}
